# ALMP Linux test VM - unattended Debian 13 install (made by Claude, 2026-11-24)
# No password is set: user "almp" logs in with an SSH key and GNOME auto-login.
# The account can be given a password later with:  sudo passwd almp
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string almp-debian13
d-i netcfg/get_domain string localdomain
d-i hw-detect/load_firmware boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i passwd/root-login boolean false
d-i passwd/user-fullname string ALMP test user
d-i passwd/username string almp
d-i passwd/user-password-crypted password !
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i clock-setup/utc boolean true
d-i time/zone string America/Toronto
d-i clock-setup/ntp boolean true
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
tasksel tasksel/first multiselect standard, gnome-desktop, ssh-server
d-i pkgsel/include string sudo open-vm-tools open-vm-tools-desktop git build-essential python3 python3-venv python3-dev python3-pip libmpv2 libmpv-dev xdotool imagemagick
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i preseed/late_command string     mkdir -p /target/home/almp/.ssh;     echo '@SSH_PUBLIC_KEY@' > /target/home/almp/.ssh/authorized_keys;     in-target chown -R almp:almp /home/almp/.ssh;     chmod 700 /target/home/almp/.ssh; chmod 600 /target/home/almp/.ssh/authorized_keys;     echo 'almp ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/almp;     chmod 0440 /target/etc/sudoers.d/almp;     mkdir -p /target/etc/gdm3;     printf '[daemon]\nAutomaticLoginEnable=true\nAutomaticLogin=almp\nWaylandEnable=false\n\n[security]\n\n[xdmcp]\n\n[chooser]\n\n[debug]\n' > /target/etc/gdm3/daemon.conf;     sed -i '/^deb cdrom:/d' /target/etc/apt/sources.list
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false

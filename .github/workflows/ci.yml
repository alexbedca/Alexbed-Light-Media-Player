# Checks every push and pull request: ruff (code checks), the test suite with real PyQt6 on
# Linux and Windows (offscreen, mpv is replaced by a stand-in), and a short playlist benchmark.
# It builds nothing and publishes nothing. Actions are pinned to full commit SHAs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff==0.16.9

      - name: Tests (real PyQt6, offscreen)
        run: python -m pytest -q -rs tests

      - name: Playlist benchmark (100k and 250k entries, 100k files scanned from disk)
        run: python tools/bench_playlist.py --sizes 100000,250000 --disk-sizes 100000 --json bench-${{ matrix.os }}.json

      - name: Ruff
        if: always()
        run: ruff check .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.json
          if-no-files-found: ignore
